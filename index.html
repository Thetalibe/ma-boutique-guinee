<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>GuinéeMarket — Acheter simplement en Guinée</title>

  <style>
    :root {
      --bg: #121212;
      --surface: #1c1c1e;
      --surface-light: #27272a;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --green: #25d366;
      --gold: #ff9900;
      --danger: #ff5a5f;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding-bottom: 100px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 16px;
      background: rgba(18, 18, 18, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--green);
    }

    .cart-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 13px;
      color: #101010;
      background: var(--gold);
      border: 0;
      border-radius: 12px;
      font-weight: 800;
    }

    .cart-count {
      display: grid;
      place-items: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      color: white;
      background: #171717;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    main {
      width: min(100%, 1100px);
      margin: auto;
      padding: 18px 14px;
    }

    .hero {
      padding: 18px 2px 24px;
    }

    .hero h1 {
      max-width: 650px;
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 7vw, 2.5rem);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero p {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 4px 0 18px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;
      padding: 10px 14px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .filter-button.active {
      color: #101010;
      background: var(--green);
      border-color: var(--green);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    }

    .product-image {
      display: grid;
      place-items: center;
      aspect-ratio: 1 / 0.85;
      padding: 12px;
      background: linear-gradient(135deg, #2c2c31, #18181b);
      font-size: clamp(2.8rem, 12vw, 4.5rem);
    }

    .product-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 12px;
    }

    .product-category {
      margin-bottom: 5px;
      color: var(--green);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .product-name {
      min-height: 42px;
      margin: 0 0 8px;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .price {
      margin: auto 0 11px;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 800;
    }

    .add-button {
      width: 100%;
      min-height: 40px;
      padding: 8px;
      color: #101010;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .add-button:active,
    .cart-button:active,
    .whatsapp-button:active {
      transform: scale(0.98);
    }

    .empty-catalog {
      grid-column: 1 / -1;
      padding: 35px 15px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, 0.7);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px;
      background: #1a1a1c;
      border: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .modal-title {
      margin: 0;
      font-size: 1.25rem;
    }

    .close-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: var(--text);
      background: var(--surface-light);
      border: 0;
      border-radius: 50%;
      font-size: 1.45rem;
    }

    .cart-items {
      display: grid;
      gap: 10px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-item-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      background: #303035;
      border-radius: 10px;
      font-size: 1.7rem;
    }

    .cart-item-name {
      margin: 0 0 3px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .cart-item-details {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .remove-button {
      width: 32px;
      height: 32px;
      color: white;
      background: transparent;
      border: 1px solid rgba(255, 90, 95, 0.5);
      border-radius: 9px;
      font-size: 1.1rem;
    }

    .empty-cart {
      padding: 25px 10px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
      border-radius: 12px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 20px;
      padding: 15px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .total-value {
      color: var(--gold);
      white-space: nowrap;
    }

    .checkout-form {
      display: grid;
      gap: 12px;
    }

    .checkout-form h3 {
      margin: 0 0 2px;
      font-size: 1rem;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: #e4e4e7;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 47px;
      padding: 11px 12px;
      color: var(--text);
      background: #28282b;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.13);
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .payment-option {
      position: relative;
      display: block;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .payment-option span {
      display: grid;
      min-height: 60px;
      place-items: center;
      padding: 7px;
      color: var(--muted);
      text-align: center;
      background: #28282b;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .payment-option input:checked + span {
      color: #101010;
      background: var(--gold);
      border-color: var(--gold);
    }

    .whatsapp-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      padding: 12px;
      color: #071c0d;
      background: var(--green);
      border: 0;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 800;
    }

    .form-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }

    @media (min-width: 650px) {
      main {
        padding: 28px 22px;
      }

      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-content {
        border-radius: 22px;
      }
    }

    @media (min-width: 920px) {
      .products-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="brand" href="#" aria-label="Accueil GuinéeMarket">Guinée<span>Market</span></a>

    <button class="cart-button" id="openCartButton" type="button" aria-label="Ouvrir le panier">
      🛒 Panier
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <h1>Vos achats, livrés simplement <span>en Guinée.</span></h1>
      <p>Des produits utiles, des prix transparents et une commande rapide par WhatsApp.</p>
    </section>

    <nav class="filters" aria-label="Filtrer les produits">
      <button class="filter-button active" data-category="Tous" type="button">Tous</button>
      <button class="filter-button" data-category="High-Tech" type="button">High-Tech</button>
      <button class="filter-button" data-category="Maison & Gadgets" type="button">Maison & Gadgets</button>
      <button class="filter-button" data-category="Mode & Accessoires" type="button">Mode & Accessoires</button>
    </nav>

    <section class="products-grid" id="productsGrid" aria-label="Produits disponibles"></section>
  </main>

  <div class="modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
    <div class="modal-content">
      <div class="modal-top">
        <h2 class="modal-title" id="cartTitle">Votre panier</h2>
        <button class="close-button" id="closeCartButton" type="button" aria-label="Fermer le panier">×</button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="total-row">
        <span>Total global</span>
        <span class="total-value" id="cartTotal">0 GNF</span>
      </div>

      <form class="checkout-form" id="checkoutForm">
        <h3>Informations de livraison</h3>

        <div class="field">
          <label for="customerName">Nom complet</label>
          <input id="customerName" type="text" placeholder="Ex. Mamadou Camara" required />
        </div>

        <div class="field">
          <label for="customerPhone">Téléphone / WhatsApp</label>
          <input id="customerPhone" type="tel" inputmode="tel" placeholder="Ex. 622 00 00 00" required />
        </div>

        <div class="field">
          <label for="deliveryLocation">Lieu de livraison</label>
          <select id="deliveryLocation" required>
            <option value="">Choisissez votre zone</option>
            <option>Kaloum</option>
            <option>Dixinn</option>
            <option>Ratoma</option>
            <option>Matam</option>
            <option>Matoto</option>
            <option>Autres villes de Guinée</option>
          </select>
        </div>

        <div class="field">
          <label>Mode de règlement</label>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="payment" value="Cash à la livraison" checked />
              <span>Cash à la livraison</span>
            </label>

            <label class="payment-option">
              <input type="radio" name="payment" value="Orange Money" />
              <span>Orange Money</span>
            </label>

            <label class="payment-option">
              <input type="radio" name="payment" value="MTN MoMo" />
              <span>MTN MoMo</span>
            </label>
          </div>
        </div>

        <button class="whatsapp-button" type="submit">
          Valider la commande sur WhatsApp 💬
        </button>

        <p class="form-note">Votre commande sera préparée après confirmation sur WhatsApp.</p>
      </form>
    </div>
  </div>

  <script>
    // Catalogue de produits affichés sur la boutique.
    const products = [
      {
        id: 1,
        name: "Écouteurs Bluetooth Pro",
        price: 150000,
        category: "High-Tech",
        icon: "🎧"
      },
      {
        id: 2,
        name: "Smartwatch Sport X8",
        price: 250000,
        category: "High-Tech",
        icon: "⌚"
      },
      {
        id: 3,
        name: "Mini-Hachoir Électrique",
        price: 180000,
        category: "Maison & Gadgets",
        icon: "🥣"
      },
      {
        id: 4,
        name: "Lampe LED Rechargeable",
        price: 95000,
        category: "Maison & Gadgets",
        icon: "💡"
      },
      {
        id: 5,
        name: "Sac à Main Élégant",
        price: 220000,
        category: "Mode & Accessoires",
        icon: "👜"
      },
      {
        id: 6,
        name: "Sandales Confort Premium",
        price: 130000,
        category: "Mode & Accessoires",
        icon: "👡"
      }
    ];

    let cart = [];
    let currentCategory = "Tous";

    const productsGrid = document.getElementById("productsGrid");
    const cartCount = document.getElementById("cartCount");
    const cartModal = document.getElementById("cartModal");
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const checkoutForm = document.getElementById("checkoutForm");

    // Formate les montants avec séparateurs de milliers en GNF.
    function formatGNF(amount) {
      return new Intl.NumberFormat("fr-FR").format(amount) + " GNF";
    }

    // Protège les textes injectés dans la page.
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Affiche les produits selon la catégorie sélectionnée.
    function renderProducts() {
      const filteredProducts = currentCategory === "Tous"
        ? products
        : products.filter(product => product.category === currentCategory);

      if (filteredProducts.length === 0) {
        productsGrid.innerHTML = '<div class="empty-catalog">Aucun produit disponible dans cette catégorie.</div>';
        return;
      }

      productsGrid.innerHTML = filteredProducts.map(product => `
        <article class="product-card">
          <div class="product-image" aria-hidden="true">${product.icon}</div>
          <div class="product-content">
            <div class="product-category">${escapeHtml(product.category)}</div>
            <h2 class="product-name">${escapeHtml(product.name)}</h2>
            <p class="price">${formatGNF(product.price)}</p>
            <button class="add-button" type="button" data-product-id="${product.id}">
              Ajouter au panier
            </button>
          </div>
        </article>
      `).join("");

      document.querySelectorAll(".add-button").forEach(button => {
        button.addEventListener("click", () => addToCart(Number(button.dataset.productId)));
      });
    }

    // Ajoute un produit ou augmente sa quantité s'il est déjà dans le panier.
    function addToCart(productId) {
      const product = products.find(item => item.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCart();
    }

    // Retire une unité du produit sélectionné.
    function removeFromCart(productId) {
      const item = cart.find(product => product.id === productId);

      if (!item) return;

      if (item.quantity > 1) {
        item.quantity -= 1;
      } else {
        cart = cart.filter(product => product.id !== productId);
      }

      updateCart();
    }

    // Met à jour le compteur, le total et la liste du panier.
    function updateCart() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartCount.textContent = totalItems;
      cartTotal.textContent = formatGNF(totalPrice);

      if (cart.length === 0) {
        cartItems.innerHTML = '<div class="empty-cart">Votre panier est vide. Ajoutez un produit pour commander.</div>';
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-icon" aria-hidden="true">${item.icon}</div>
          <div>
            <p class="cart-item-name">${escapeHtml(item.name)}</p>
            <p class="cart-item-details">
              ${item.quantity} × ${formatGNF(item.price)} = ${formatGNF(item.price * item.quantity)}
            </p>
          </div>
          <button class="remove-button" type="button" data-remove-id="${item.id}" aria-label="Retirer un ${escapeHtml(item.name)}">
            −
          </button>
        </div>
      `).join("");

      document.querySelectorAll(".remove-button").forEach(button => {
        button.addEventListener("click", () => removeFromCart(Number(button.dataset.removeId)));
      });
    }

    function openCart() {
      cartModal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeCart() {
      cartModal.classList.remove("open");
      document.body.style.overflow = "";
    }

    // Boutons de filtres.
    document.querySelectorAll(".filter-button").forEach(button => {
      button.addEventListener("click", () => {
        currentCategory = button.dataset.category;

        document.querySelectorAll(".filter-button").forEach(filterButton => {
          filterButton.classList.remove("active");
        });

        button.classList.add("active");
        renderProducts();
      });
    });

    document.getElementById("openCartButton").addEventListener("click", openCart);
    document.getElementById("closeCartButton").addEventListener("click", closeCart);

    // Ferme la fenêtre en cliquant sur le fond sombre.
    cartModal.addEventListener("click", event => {
      if (event.target === cartModal) closeCart();
    });

    // Ferme la fenêtre avec la touche Échap.
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeCart();
    });

    // Crée le message de commande et ouvre WhatsApp.
    checkoutForm.addEventListener("submit", event => {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Votre panier est vide. Ajoutez au moins un produit avant de commander.");
        return;
      }

      const customerName = document.getElementById("customerName").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      const deliveryLocation = document.getElementById("deliveryLocation").value;
      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      const orderLines = cart.map((item, index) => {
        return `${index + 1}. ${item.name} — ${item.quantity} × ${formatGNF(item.price)} = ${formatGNF(item.price * item.quantity)}`;
      }).join("\n");

      const message = `Bonjour GuinéeMarket ! 👋

*Nouvelle commande*

*Client :* ${customerName}
*Téléphone / WhatsApp :* ${customerPhone}
*Lieu de livraison :* ${deliveryLocation}
*Paiement souhaité :* ${paymentMethod}

*Produits commandés :*
${orderLines}

*TOTAL GLOBAL : ${formatGNF(totalPrice)}*

Merci de confirmer ma commande.`;

      // Numéro WhatsApp au format international, sans le préfixe 00.
      const whatsappNumber = "224626454118";
      const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

      window.open(whatsappUrl, "_blank", "noopener,noreferrer");
    });

    // Chargement initial de la boutique.
    renderProducts();
    updateCart();
  </script>
</body>
</html>
